name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only - upload the apk as a workflow artifact instead of publishing a release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, the changelog is built from the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.1
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          . scripts/release-lib.sh

          pubspec=$(pubspec_version pubspec.yaml)

          if [ "${{ github.event_name }}" = "push" ]; then
            tag=${GITHUB_REF_NAME}
            version=${tag#v}
            # Safety net for a tag pushed by hand instead of through scripts/release.sh.
            if [ "$version" != "$pubspec" ]; then
              echo "::error::tag $tag does not match version '$pubspec' in pubspec.yaml"
              exit 1
            fi
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          else
            version=$pubspec
            tag=v$version
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(version_code "$version")" >> "$GITHUB_OUTPUT"
          # Anything with a `-alpha.N` / `-beta.N` / `-rc.N` suffix is a pre-release.
          case $version in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::secret KEYSTORE_BASE64 is not set - the apk would be signed with a throwaway debug key"
            exit 1
          fi
          # Outside the workspace so it can never be picked up as a build input or artifact.
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build apk
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --build-number=${{ steps.version.outputs.code }}
          mkdir -p dist
          mv build/app/outputs/flutter-apk/app-release.apk \
             "dist/CrypthoraChatWrapper-${{ steps.version.outputs.tag }}.apk"

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          . scripts/release-lib.sh

          tag="${{ steps.version.outputs.tag }}"
          ref="${{ steps.version.outputs.ref }}"
          prev=$(previous_tag "$ref")

          generate_changelog "$prev" "$ref" > notes.md

          {
            echo ""
            echo "---"
            echo ""
            echo "Download \`CrypthoraChatWrapper-$tag.apk\` below and install it on your Android device."
            if [ -n "$prev" ]; then
              echo ""
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$prev...$tag"
            fi
          } >> notes.md

          echo "--- release notes ---"
          cat notes.md

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/CrypthoraChatWrapper-${{ steps.version.outputs.tag }}.apk" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file notes.md \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }}

      - name: Upload apk as artifact (dry run)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: CrypthoraChatWrapper-${{ steps.version.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error
